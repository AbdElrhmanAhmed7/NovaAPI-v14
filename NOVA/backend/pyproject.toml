[project]
name = "nova-backend"
version = "1.0.0"
description = "NOVA – Beyond the Mission | Authoritative gameplay backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff – lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions", ".venv", "nova_upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF012",  # mutable class defaults on pydantic models are fine
    "SIM108",  # ternary is not always clearer
    "E501",    # line length handled by the formatter
]
# "NOVA – Beyond the Mission" is the product name, and science payloads use a
# real multiplication sign. These are deliberate typography, not typos.
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

# ``conftest`` and the ``scripts/`` helpers are importable because pytest and the
# CLI put them on sys.path. Declare them first-party so the import order does not
# depend on which ruff version happens to be installed.
[tool.ruff.lint.isort]
known-first-party = ["app", "conftest", "autopilot", "audit_player_text"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations/", "\\.venv/", "nova_upstream/"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
# A stream regression must fail the suite, not wedge it: every test gets a
# generous ceiling (the campaign fixture plays 15 missions over HTTP).
timeout = 120
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: long running integration tests",
    "nasa: tests that exercise the NASA integration layer",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async driver runs every DB call inside a greenlet. Without this,
# coverage silently drops the lines that follow an ``await`` on a DB call and
# reports ~85% for code the suite actually exercises.
concurrency = ["greenlet", "thread"]
omit = ["app/main.py", "*/__init__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
