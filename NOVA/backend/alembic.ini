# NOVA - Beyond the Mission | Alembic configuration.
#
# The database URL is NOT stored here: migrations/env.py reads it from the
# NOVA settings (NOVA_DATABASE_URL / .env), so there is one source of truth.
#
#   alembic upgrade head                 # apply every migration
#   alembic revision --autogenerate -m "add x"
#   alembic -x url=sqlite+aiosqlite:///./data/other.db upgrade head
#
# In dev you can keep NOVA_AUTO_CREATE_TABLES=true and skip Alembic entirely;
# in production set it to false and run `alembic upgrade head` on deploy.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
